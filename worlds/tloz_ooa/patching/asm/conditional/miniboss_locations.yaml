# Data come from ages/mainData.s in the disassembly

# How object data works:
# The first byte is a type of object. 
  # F3 specifies that you have other data elsewhere that need on top of the other data at the pointer given in the second and third byte
  # F4 specifies that like F3, you have other data to load but only if the event flag isn't set (This is mainly used to load the miniboss in our cases)
  # In the generic case, the first byte is the object ID. In such case :
    # The second byte is the subid of the object.
    # The third byte is the object's Y position
    # The fourth byte is the object's X position
  # The first of the generic case is always preceed by F2 (offsetting the other bytes)

# WARNING : a object data end with $ff for obj_End, a pointer end with $fe for obj_EndPointer

#There are other behavior that doesn't concern us here, but can be check in macros.s of the disassembly (search for .MACRO obj_Interaction and look around)

# Here we replace the F4 pointer of the mini boss by our custom one where we add our object and add back the miniboss pointer

###### D1
12/6714/: |
  db $f3
  dw additionnalD1MiniBossRoomData

12//additionnalD1MiniBossRoomData: |
  db $f2,$12,$01,$58,$98 # The newly spawn object data
  db $f4,$95,$47 # Keeping the overrided data.
  db $fe

