# entries (ID, subID) indexed by wDungeon Index
15//bossItemTable: |
    dwbe locations.d0Boss
    dwbe locations.d1Boss
    db $00,$00                  ; Lost Labyrinth (Past) doesn't have a boss
    dwbe locations.d3Boss
    dwbe locations.d4Boss
    dwbe locations.d5Boss

# spawn items from bossItemTable in place of boss heart containers.
15//spawnBossItem: |
    push hl
    ld hl,bossItemTable
    ld a,(wDungeonIndex)
    cp $0c   ; ages d6 past
    jr nz,@next
    ld a,$06
    @next:
    rst 18
    ld b,(hl)
    inc hl
    ld c,(hl)
    call createTreasure
    call objectCopyPosition
    pop hl
    ret

0c/4c06/: | 
    db asm15
    dw spawnBossItem